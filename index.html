<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colculator</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css">
    <!-- <link rel="stylesheet" href="./css/style-dark.css"> -->
</head>

<body>
    <div class="container">
        <div class="Output"></div>
        <div class="buttons">
            <section class="culmn-1">
                <button>
                    Ac
                </button>
                <button>
                    <i class="ri-delete-back-2-line"></i>
                </button>
                <button>
                    %
                </button>
                <button>
                    <i class="ri-divide-line"></i>
                </button>

            </section>
            <section class="culmn-2">
                <button>
                    7
                </button>
                <button>
                    8
                </button>
                <button>
                    9
                </button>
                <button>
                    ×
                </button>
            </section>
            <section class="culmn-3">
                <button>
                    4
                </button>
                <button>
                    5
                </button>
                <button>
                    6
                </button>
                <button>
                    -
                </button>
            </section>
            <section class="culmn-4">
                <button>
                    1
                </button>
                <button>
                    2
                </button>
                <button>
                    3
                </button>
                <button>
                    <i class="ri-add-line"></i>
                </button>
            </section>
            <section>
                <button>
                    ()
                </button>
                <button>
                    0
                </button>
                <button>
                    .
                </button>
                <button>
                    =
                </button>
            </section>
            <div class="dark-light-btn">
                <button><i class="ri-moon-fill"></i></button>
                <button><i class="ri-sun-line"></i></button>

            </div>
        </div>
    </div>

</body>

</html>
